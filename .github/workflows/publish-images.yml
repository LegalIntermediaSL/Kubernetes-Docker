name: publish-images

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: hola-nginx
            context: examples/docker/hola-nginx
          - name: python-api
            context: examples/docker/python-api
          - name: fullstack-api
            context: examples/docker/fullstack-demo/api
          - name: fullstack-web
            context: examples/docker/fullstack-demo/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/kubernetes-docker-${{ matrix.name }}:${{ steps.version.outputs.value }}
            ghcr.io/${{ github.repository_owner }}/kubernetes-docker-${{ matrix.name }}:latest
