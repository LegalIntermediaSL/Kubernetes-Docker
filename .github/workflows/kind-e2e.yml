name: kind-e2e

on:
  push:
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: curso-k8s-ci

      - name: Build python api image
        run: make build-python-api

      - name: Load image into kind
        run: make kind-load-python-api

      - name: Deploy with Kustomize
        run: make deploy-kustomize-dev

      - name: Smoke test Kustomize deployment
        run: make verify-kustomize-dev

      - name: Deploy with Helm
        run: make deploy-helm-dev

      - name: Smoke test Helm deployment
        run: make verify-helm-dev

      - name: Deploy ConfigMap and Secret demo
        run: make deploy-configmap-secret-demo

      - name: Smoke test ConfigMap and Secret demo
        run: make verify-configmap-secret-demo

      - name: Deploy Job and CronJob demo
        run: make deploy-job-cronjob-demo

      - name: Smoke test Job and CronJob demo
        run: make verify-job-cronjob-demo
