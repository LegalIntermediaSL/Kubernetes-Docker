site_name: Kubernetes-Docker
site_description: Curso practico completo de Docker y Kubernetes en espanol.
repo_name: LegalIntermediaSL/Kubernetes-Docker
repo_url: https://github.com/LegalIntermediaSL/Kubernetes-Docker
docs_dir: docs
site_dir: site
use_directory_urls: true
strict: true

theme:
  name: readthedocs

plugins:
  - search
  - mermaid2

markdown_extensions:
  - admonition
  - attr_list
  - fenced_code
  - tables
  - toc:
      permalink: true

extra_css:
  - assets/stylesheets/extra.css

nav:
  - Inicio: index.md
