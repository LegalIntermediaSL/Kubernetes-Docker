services:
  writer:
    image: busybox:1.36
    command:
      - /bin/sh
      - -c
      - |
        mkdir -p /data
        while true; do
          echo "$$(date '+%Y-%m-%dT%H:%M:%S%z') value=$$(od -An -N2 -tu2 /dev/urandom | tr -d ' ')" >> /data/log.txt
          sleep 5
        done
    volumes:
      - demo_data:/data

volumes:
  demo_data:
    name: course-volume-backup-demo-data
