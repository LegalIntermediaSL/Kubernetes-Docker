<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hola desde Docker y Kubernetes</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #0f172a, #1d4ed8);
        color: #ffffff;
      }

      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
      }

      section {
        max-width: 720px;
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 20px;
        padding: 2rem;
        backdrop-filter: blur(8px);
      }

      h1 {
        margin-top: 0;
        font-size: 2.5rem;
      }

      p {
        line-height: 1.6;
      }

      code {
        background: rgba(15, 23, 42, 0.4);
        padding: 0.15rem 0.4rem;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h1>Hola desde Docker y Kubernetes</h1>
        <p>
          Esta página se sirve desde un contenedor basado en <code>nginx</code>.
        </p>
        <p>
          El objetivo de este ejemplo es mostrar un flujo mínimo pero completo:
          construir una imagen, ejecutarla con Docker y desplegarla luego en un
          clúster local de Kubernetes.
        </p>
      </section>
    </main>
  </body>
</html>
