apiVersion: v1
kind: Service
metadata:
  name: {{ include "python-api.fullname" . }}
  labels:
{{ include "python-api.labels" . | indent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ include "python-api.fullname" . }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
