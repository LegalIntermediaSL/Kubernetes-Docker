environment: base

api:
  replicaCount: 2
  image:
    repository: fullstack-api
    tag: local
    pullPolicy: IfNotPresent
  appName: Fullstack Demo
  appEnv: kubernetes
  port: "8000"
  redisKey: fullstack:visits
  resetToken: reset-demo
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

web:
  replicaCount: 1
  image:
    repository: fullstack-web
    tag: local
    pullPolicy: IfNotPresent
  service:
    port: 80
    targetPort: 80

redis:
  image:
    repository: redis
    tag: 7-alpine
    pullPolicy: IfNotPresent
  password: redis-demo

ingress:
  enabled: false
  host: fullstack.local
