apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fullstack-demo.fullname" . }}-api
  labels:
{{ include "fullstack-demo.labels" . | indent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "fullstack-demo.fullname" . }}-api
  template:
    metadata:
      labels:
        app: {{ include "fullstack-demo.fullname" . }}-api
    spec:
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "fullstack-demo.fullname" . }}-config
            - secretRef:
                name: {{ include "fullstack-demo.fullname" . }}-secret
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
{{ toYaml .Values.api.resources | indent 12 }}
