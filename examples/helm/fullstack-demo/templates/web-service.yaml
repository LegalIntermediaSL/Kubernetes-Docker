apiVersion: v1
kind: Service
metadata:
  name: {{ include "fullstack-demo.fullname" . }}-web
  labels:
{{ include "fullstack-demo.labels" . | indent 4 }}
spec:
  selector:
    app: {{ include "fullstack-demo.fullname" . }}-web
  ports:
    - port: {{ .Values.web.service.port }}
      targetPort: {{ .Values.web.service.targetPort }}
  type: ClusterIP
