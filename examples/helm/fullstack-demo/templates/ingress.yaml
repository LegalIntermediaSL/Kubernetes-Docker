{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "fullstack-demo.fullname" . }}
  labels:
{{ include "fullstack-demo.labels" . | indent 4 }}
spec:
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "fullstack-demo.fullname" . }}-web
                port:
                  number: {{ .Values.web.service.port }}
{{- end }}
