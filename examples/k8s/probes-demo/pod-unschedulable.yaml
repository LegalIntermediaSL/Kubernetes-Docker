apiVersion: v1
kind: Pod
metadata:
  name: unschedulable-demo
spec:
  containers:
    - name: sleeper
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      resources:
        requests:
          cpu: "8"
          memory: "8Gi"
        limits:
          cpu: "8"
          memory: "8Gi"
