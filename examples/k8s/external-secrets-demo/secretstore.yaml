apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: k8s-source-store
  namespace: external-secrets-demo
spec:
  provider:
    kubernetes:
      remoteNamespace: secret-source
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-reader
