apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: synced-database-credentials
  namespace: external-secrets-demo
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: SecretStore
    name: k8s-source-store
  target:
    name: database-credentials-local
  data:
    - secretKey: username
      remoteRef:
        key: database-credentials
        property: username
    - secretKey: password
      remoteRef:
        key: database-credentials
        property: password
