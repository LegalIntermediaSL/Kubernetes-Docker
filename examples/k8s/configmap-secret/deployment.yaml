apiVersion: apps/v1
kind: Deployment
metadata:
  name: env-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: env-demo
  template:
    metadata:
      labels:
        app: env-demo
    spec:
      containers:
        - name: env-demo
          image: python:3.12-slim
          command: ["python", "-c"]
          args:
            - |
              import os
              from http.server import BaseHTTPRequestHandler, HTTPServer

              class Handler(BaseHTTPRequestHandler):
                  def do_GET(self):
                      self.send_response(200)
                      self.send_header("Content-type", "text/plain; charset=utf-8")
                      self.end_headers()
                      body = (
                          f"APP_NAME={os.getenv('APP_NAME')}\n"
                          f"APP_MODE={os.getenv('APP_MODE')}\n"
                          f"API_TOKEN={os.getenv('API_TOKEN')}\n"
                      )
                      self.wfile.write(body.encode("utf-8"))

              HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
          envFrom:
            - configMapRef:
                name: env-demo-config
            - secretRef:
                name: env-demo-secret
          ports:
            - containerPort: 8080
