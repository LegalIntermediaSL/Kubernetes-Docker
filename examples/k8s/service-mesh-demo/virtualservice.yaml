apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: fullstack
spec:
  hosts:
    - fullstack.local
  gateways:
    - fullstack-gateway
  http:
    - match:
        - uri:
            prefix: /api
      route:
        - destination:
            host: fullstack-api
            port:
              number: 80
    - route:
        - destination:
            host: fullstack-web
            port:
              number: 80
