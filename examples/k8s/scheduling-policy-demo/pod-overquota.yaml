apiVersion: v1
kind: Pod
metadata:
  name: overquota-demo
  namespace: scheduling-demo
spec:
  restartPolicy: Never
  containers:
    - name: overquota-demo
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      resources:
        requests:
          cpu: 500m
          memory: 512Mi
        limits:
          cpu: 700m
          memory: 768Mi
