apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tls-demo
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - tls-demo.local
      secretName: tls-demo-cert
  rules:
    - host: tls-demo.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tls-demo
                port:
                  number: 80
