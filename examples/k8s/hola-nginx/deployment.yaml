apiVersion: apps/v1
kind: Deployment
metadata:
  name: hola-nginx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hola-nginx
  template:
    metadata:
      labels:
        app: hola-nginx
    spec:
      containers:
        - name: hola-nginx
          image: hola-nginx:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
