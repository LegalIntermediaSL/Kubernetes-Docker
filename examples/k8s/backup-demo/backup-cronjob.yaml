apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-archive
  namespace: backup-demo
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: busybox:1.36
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  mkdir -p /backup/archive
                  FILE="/backup/archive/data-$(date +%Y%m%d-%H%M%S).tgz"
                  tar -czf "${FILE}" -C /source .
                  echo "Backup creado en ${FILE}"
                  ls -lah /backup/archive
              volumeMounts:
                - name: source-data
                  mountPath: /source
                - name: backup-archive
                  mountPath: /backup
          volumes:
            - name: source-data
              persistentVolumeClaim:
                claimName: source-data
            - name: backup-archive
              persistentVolumeClaim:
                claimName: backup-archive
