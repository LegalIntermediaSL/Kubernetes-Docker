apiVersion: apps/v1
kind: Deployment
metadata:
  name: backup-writer
  namespace: backup-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backup-writer
  template:
    metadata:
      labels:
        app: backup-writer
    spec:
      containers:
        - name: writer
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              mkdir -p /data
              while true; do
                echo "$(date '+%Y-%m-%dT%H:%M:%S%z') sample=$(od -An -N2 -tu2 /dev/urandom | tr -d ' ')" >> /data/log.txt
                sleep 10
              done
          volumeMounts:
            - name: source-data
              mountPath: /data
      volumes:
        - name: source-data
          persistentVolumeClaim:
            claimName: source-data
