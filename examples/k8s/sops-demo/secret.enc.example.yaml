# Ejemplo ilustrativo.
# Regeneralo con tus propias claves usando SOPS antes de intentar descifrarlo o reconciliarlo.
apiVersion: v1
kind: Secret
metadata:
  name: gitops-db-credentials
  namespace: sops-demo
type: Opaque
stringData:
  username: ENC[AES256_GCM,data:REEMPLAZA_CON_UN_VALOR_REAL,iv:REEMPLAZA,tag:REEMPLAZA,type:str]
  password: ENC[AES256_GCM,data:REEMPLAZA_CON_UN_VALOR_REAL,iv:REEMPLAZA,tag:REEMPLAZA,type:str]
sops:
  age:
    - recipient: age1reemplaza-por-tu-clave-publica
      enc: |
        -----BEGIN AGE ENCRYPTED FILE-----
        REEMPLAZA_CON_EL_BLOQUE_REAL_GENERADO_POR_SOPS
        -----END AGE ENCRYPTED FILE-----
  encrypted_regex: ^(data|stringData)$
  lastmodified: "2026-06-22T00:00:00Z"
  mac: ENC[AES256_GCM,data:REEMPLAZA,iv:REEMPLAZA,tag:REEMPLAZA,type:str]
  version: 3.9.0
