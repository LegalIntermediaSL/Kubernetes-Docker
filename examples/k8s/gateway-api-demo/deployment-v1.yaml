apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-api-v1
  namespace: gateway-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: python-api-v1
  template:
    metadata:
      labels:
        app: python-api-v1
    spec:
      containers:
        - name: python-api
          image: python-api:local
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_NAME
              value: Gateway API Demo
            - name: APP_ENV
              value: v1
            - name: PORT
              value: "8000"
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
