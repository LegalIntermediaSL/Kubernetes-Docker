apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-api
  namespace: cert-manager-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: python-api
  template:
    metadata:
      labels:
        app: python-api
    spec:
      containers:
        - name: python-api
          image: python-api:local
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_NAME
              value: Python API TLS Demo
            - name: APP_ENV
              value: tls-demo
            - name: PORT
              value: "8000"
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
