apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: python-api
  namespace: cert-manager-demo
  annotations:
    cert-manager.io/cluster-issuer: selfsigned-local
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - python-api.local
      secretName: python-api-tls
  rules:
    - host: python-api.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: python-api
                port:
                  number: 80
