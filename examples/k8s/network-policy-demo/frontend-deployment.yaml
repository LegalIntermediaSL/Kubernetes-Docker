apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: network-policy-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
      tier: frontend
  template:
    metadata:
      labels:
        app: frontend
        tier: frontend
    spec:
      containers:
        - name: frontend
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
