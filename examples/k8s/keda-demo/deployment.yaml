apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-api-keda
  namespace: keda-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: python-api-keda
  template:
    metadata:
      labels:
        app: python-api-keda
    spec:
      containers:
        - name: python-api
          image: python-api:local
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_NAME
              value: Curso KEDA
            - name: APP_ENV
              value: keda-demo
            - name: PORT
              value: "8000"
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
