apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-generator
  namespace: keda-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traffic-generator
  template:
    metadata:
      labels:
        app: traffic-generator
    spec:
      containers:
        - name: traffic-generator
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              while true; do
                wget -q -O- http://python-api-keda >/dev/null
                sleep 1
              done
