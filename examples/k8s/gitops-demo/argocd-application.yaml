apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fullstack-demo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/example/Kubernetes-Docker.git
    targetRevision: main
    path: examples/helm/fullstack-demo
    helm:
      valueFiles:
        - values-demo.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
