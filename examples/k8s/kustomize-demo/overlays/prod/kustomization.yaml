apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kustomize-prod
resources:
  - namespace.yaml
  - ../../base
replicas:
  - name: python-api
    count: 3
images:
  - name: python-api
    newName: ghcr.io/example/kubernetes-docker-python-api
    newTag: 1.0.0
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: python-api-config
    behavior: merge
    literals:
      - APP_NAME=Python API Kustomize Prod
      - APP_ENV=prod
      - PORT=8000
patches:
  - path: deployment-patch.yaml
