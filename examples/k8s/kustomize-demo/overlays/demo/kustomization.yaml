apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kustomize-demo
resources:
  - namespace.yaml
  - ../../base
replicas:
  - name: python-api
    count: 2
images:
  - name: python-api
    newName: ghcr.io/example/kubernetes-docker-python-api
    newTag: 1.0.0
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: python-api-config
    behavior: merge
    literals:
      - APP_NAME=Python API Kustomize Demo
      - APP_ENV=demo
      - PORT=8000
