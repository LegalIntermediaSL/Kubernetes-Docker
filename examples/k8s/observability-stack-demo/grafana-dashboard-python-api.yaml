apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-python-api
  labels:
    grafana_dashboard: "1"
data:
  python-api-dashboard.json: |
    {
      "title": "Python API",
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "panels": [
        {
          "type": "timeseries",
          "title": "Request rate",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(rate(python_api_requests_total[5m])) by (endpoint)",
              "legendFormat": "{{endpoint}}"
            }
          ],
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 0
          }
        }
      ]
    }
